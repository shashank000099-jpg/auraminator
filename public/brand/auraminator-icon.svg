<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <!-- Background (Pitch Black) -->
  <rect width="500" height="500" rx="40" fill="#000000"/>
  
  <defs>
    <linearGradient id="iconTopL" x1="100" y1="140" x2="250" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#E4E4E7"/>
    </linearGradient>
    <linearGradient id="iconTopR" x1="400" y1="140" x2="250" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E4E4E7"/>
      <stop offset="100%" stopColor="#71717A"/>
    </linearGradient>
    <linearGradient id="iconLegL" x1="100" y1="140" x2="250" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="iconLegR" x1="400" y1="140" x2="250" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#D4D4D8"/>
    </linearGradient>
  </defs>

  <!-- Top Roof Facets -->
  <path d="M 250 50 L 75 150 L 250 240 Z" fill="url(#iconTopL)" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 250 50 L 425 150 L 250 240 Z" fill="url(#iconTopR)" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>

  <!-- Left & Right Main Monolith Pillars (A-Legs) -->
  <path d="M 75 150 L 250 240 L 250 450 L 75 350 Z" fill="url(#iconLegL)" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 425 150 L 250 240 L 250 450 L 425 350 Z" fill="url(#iconLegR)" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>

  <!-- Inner Apex Chasm (Geometric Notch) -->
  <path d="M 250 240 L 190 330 L 250 380 L 310 330 Z" fill="#000000" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

  <!-- Outer Structural Outline -->
  <path d="M 250 50 L 425 150 L 425 350 L 250 450 L 75 350 L 75 150 Z" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>

  <!-- Ridge Lines -->
  <line x1="250" y1="50" x2="250" y2="240" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <line x1="250" y1="380" x2="250" y2="450" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
</svg>
