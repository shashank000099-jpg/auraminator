<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" fill="none">
  <defs>
    <linearGradient id="transTopL" x1="60" y1="90" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#E4E4E7"/>
    </linearGradient>
    <linearGradient id="transTopR" x1="240" y1="90" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E4E4E7"/>
      <stop offset="100%" stopColor="#71717A"/>
    </linearGradient>
    <linearGradient id="transLegL" x1="60" y1="90" x2="150" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="transLegR" x1="240" y1="90" x2="150" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#D4D4D8"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(30, 10)">
    <!-- Top Roof Facets -->
    <path d="M 150 40 L 50 100 L 150 150 Z" fill="url(#transTopL)" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 150 40 L 250 100 L 150 150 Z" fill="url(#transTopR)" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

    <!-- Left & Right Main Pillars -->
    <path d="M 50 100 L 150 150 L 150 260 L 50 200 Z" fill="url(#transLegL)" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 250 100 L 150 150 L 150 260 L 250 200 Z" fill="url(#transLegR)" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

    <!-- Inner Apex Notch -->
    <path d="M 150 150 L 115 200 L 150 225 L 185 200 Z" fill="#000000" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>

    <!-- Outer Structural Outline -->
    <path d="M 150 40 L 250 100 L 250 200 L 150 260 L 50 200 L 50 100 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Ridge Lines -->
    <line x1="150" y1="40" x2="150" y2="150" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="225" x2="150" y2="260" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography: AURAMINATOR.IN -->
  <g transform="translate(340, 155)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="78" letter-spacing="-2px">
      AURAMINATOR<tspan fill="#71717A">.IN</tspan>
    </text>
    <text x="5" y="45" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" font-size="19" letter-spacing="7px">
      LUXURY STREETWEAR &amp; DIGITAL VAULT
    </text>
  </g>
</svg>
